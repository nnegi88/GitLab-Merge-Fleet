name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Separate job so lint reports quickly and never stops the test suite from running
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    # A healthy run (unit, component, E2E in two browsers, coverage) takes
    # about 10 minutes; cap failing E2E runs instead of letting them run for hours
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run unit tests
        run: npm run test:unit

      - name: Run component tests
        # Run even when unit tests fail, so CI reports both suites
        if: always()
        run: npm run test:component

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        # Also upload when the run is cancelled (e.g. by the job timeout)
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
